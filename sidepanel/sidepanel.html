<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>입학요강 확인</title>
    <link rel="stylesheet" href="sidepanel.css">
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Admission Check</p>
          <h1>입학요강 확인</h1>
        </div>
        <button class="icon-button" id="open-tools-button" type="button" aria-label="도구 열기" title="도구">•••</button>
      </header>

      <section class="basis-strip" aria-labelledby="basis-title">
        <div>
          <h2 class="sr-only" id="basis-title">현재 분석 기준</h2>
          <strong id="basis-cycle"></strong>
          <span id="basis-mode"></span>
        </div>
        <button class="text-button" id="edit-basis-button" type="button">변경</button>
      </section>
      <p class="warning-line" id="non-september-warning" hidden>9월 외 입학 기준입니다.</p>
      <p class="status-line" id="basis-status" role="status" aria-live="polite"></p>

      <section class="identity-card" aria-labelledby="university-name">
        <div class="identity-card__heading">
          <div>
            <p class="eyebrow" id="page-kicker">현재 페이지</p>
            <h2 id="university-name">페이지 확인 중…</h2>
          </div>
          <button class="pencil-button" id="edit-university-memo-button" type="button" aria-label="대학 전체 확인한 사항 편집" title="대학 메모 편집" disabled>✎</button>
        </div>
        <p class="course-name" id="course-name"></p>
        <p class="page-message" id="page-message" role="status"></p>
        <div id="university-memo"></div>
      </section>

      <section class="analysis-section" aria-labelledby="result-title">
        <div class="section-heading">
          <div>
            <h2 id="result-title">확인 결과</h2>
            <div class="analysis-summary" id="analysis-summary" aria-live="polite"></div>
          </div>
          <button class="button button--secondary button--compact" id="analyze-button" type="button" hidden>다시 분석</button>
        </div>
        <div class="stale-notice" id="stale-notice" hidden>기준이 바뀌었습니다. 현재 페이지를 다시 분석해주세요.</div>
        <ul class="field-list" id="field-list"></ul>
        <hr class="field-group-divider" id="field-group-divider" aria-hidden="true">
        <ul class="field-list" id="supporting-field-list"></ul>
      </section>
    </main>

    <dialog class="dialog" id="tools-dialog" aria-labelledby="tools-title">
      <div class="dialog__header">
        <div><p class="eyebrow">설정과 기록</p><h2 id="tools-title">도구</h2></div>
        <button class="icon-button" id="close-tools-button" type="button" aria-label="도구 닫기">×</button>
      </div>
      <div class="tools-list">
        <button class="tool-row" id="open-issue-manager-button" type="button">
          <span><strong>문제 기록</strong><small>앱에서 반복되는 오류를 남깁니다.</small></span>
          <span id="open-issue-count">0</span>
        </button>
        <button class="tool-row" id="export-issues-button" type="button">
          <span><strong>문제 기록 내보내기</strong><small>해결된 기록을 포함한 JSON</small></span>
          <span>↓</span>
        </button>
        <label class="tool-row tool-row--toggle" for="hide-known-widgets-input">
          <span><strong>상담 위젯 숨기기</strong><small>알려진 위젯만 현재 탭에서 숨깁니다.</small></span>
          <input id="hide-known-widgets-input" type="checkbox">
        </label>
      </div>
      <p class="status-line" id="tools-status" role="status" aria-live="polite"></p>
    </dialog>

    <dialog class="dialog" id="basis-dialog" aria-labelledby="basis-dialog-title">
      <form id="basis-form" novalidate>
        <div class="dialog__header">
          <div><p class="eyebrow">전체 분석에 적용</p><h2 id="basis-dialog-title">분석 기준</h2></div>
          <button class="icon-button" id="close-basis-button" type="button" aria-label="분석 기준 닫기">×</button>
        </div>
        <div class="form-grid">
          <label>학년도<input id="academic-cycle-input" required placeholder="2026/27"></label>
          <label>입학 월<select id="intake-month-input"></select></label>
          <label>입학 연도<input id="intake-year-input" type="number" min="2000" max="2100" required></label>
          <label>과정 형태<select id="study-mode-input"><option value="full-time">Full-time</option><option value="part-time">Part-time</option></select></label>
          <label>학비 구분<select id="fee-status-input"><option value="international">International</option><option value="home">Home</option></select></label>
        </div>
        <p class="form-error" id="basis-error" role="alert"></p>
        <div class="dialog__actions"><button class="button button--secondary" id="cancel-basis-button" type="button">취소</button><button class="button button--primary" id="save-basis-button" type="submit">저장</button></div>
      </form>
    </dialog>

    <dialog class="dialog" id="memo-dialog" aria-labelledby="memo-dialog-title">
      <form id="memo-form" novalidate>
        <div class="dialog__header">
          <div><p class="eyebrow" id="memo-dialog-eyebrow">확인한 사항</p><h2 id="memo-dialog-title">확인한 사항 추가</h2></div>
          <button class="icon-button" id="close-memo-button" type="button" aria-label="확인한 사항 닫기">×</button>
        </div>
        <p class="dialog-context" id="memo-context"></p>
        <div class="form-stack">
          <label id="memo-summary-select-field" hidden>확인 내용 <span aria-hidden="true">*</span><select id="memo-summary-select" required><option value="">선택해주세요</option></select></label>
          <label id="memo-summary-text-field">한 줄 요약 <span aria-hidden="true">*</span><input id="memo-summary-input" maxlength="500" required placeholder="다음 업무에서 바로 알아야 할 내용"></label>
          <label>상세 설명 <span class="optional">선택</span><textarea id="memo-details-input" rows="4" maxlength="4000"></textarea></label>
          <label>출처 URL <span class="optional">선택</span><input id="memo-source-url-input" type="url" placeholder="https://..."></label>
          <fieldset>
            <legend>확인 상태</legend>
            <label class="radio-row"><input name="memo-state" id="memo-unverified-input" type="radio" value="unverified" checked> 미확인</label>
            <label class="radio-row"><input name="memo-state" id="memo-confirmed-input" type="radio" value="confirmed"> 확인됨</label>
          </fieldset>
          <div class="confirmation-date" id="confirmation-date-fields" hidden>
            <label>마지막 확인일<input id="memo-confirmed-date-input" type="date"></label>
            <button class="button button--secondary button--compact" id="memo-today-button" type="button">오늘</button>
          </div>
        </div>
        <p class="form-error" id="memo-error" role="alert"></p>
        <div class="dialog__actions dialog__actions--spread">
          <button class="text-button text-button--danger" id="delete-memo-button" type="button" hidden>삭제</button>
          <span class="dialog__actions"><button class="button button--secondary" id="cancel-memo-button" type="button">취소</button><button class="button button--primary" id="save-memo-button" type="submit">저장</button></span>
        </div>
      </form>
    </dialog>

    <dialog class="dialog dialog--wide" id="issue-dialog" aria-labelledby="issue-title">
      <div class="dialog__header">
        <div><p class="eyebrow">앱 개선용</p><h2 id="issue-title">문제 기록</h2></div>
        <button class="icon-button" id="close-issue-button" type="button" aria-label="문제 기록 닫기">×</button>
      </div>
      <form id="issue-form" novalidate>
        <p class="dialog-context" id="issue-context"></p>
        <label class="form-stack">발견한 문제<textarea id="issue-note-input" rows="3" maxlength="2000" required placeholder="예: 지원비 대신 상담 위젯의 숫자를 가져옴"></textarea></label>
        <div class="dialog__actions"><button class="button button--secondary" id="cancel-issue-edit-button" type="button" hidden>수정 취소</button><button class="button button--primary" id="save-issue-button" type="submit">저장</button></div>
      </form>
      <p class="status-line" id="issue-status" role="status" aria-live="polite"></p>
      <div class="issue-filter"><strong>기록 <span id="issue-count">0</span></strong><label><input id="show-resolved-input" type="checkbox"> 해결됨 포함</label></div>
      <p class="empty-state" id="issue-empty">아직 기록이 없습니다.</p>
      <ol class="issue-list" id="issue-list"></ol>
    </dialog>

    <script type="module" src="sidepanel.js"></script>
  </body>
</html>
